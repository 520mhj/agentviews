<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="agentviews">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="55%" stop-color="#111a33"/>
      <stop offset="100%" stop-color="#1b1140"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F8CFF"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 底：圆角方块 -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#edge)" stroke-opacity=".55" stroke-width="3"/>

  <!-- 浏览器窗口框（页面是壳） -->
  <rect x="96" y="112" width="320" height="288" rx="26" fill="none" stroke="url(#edge)" stroke-width="7" stroke-opacity=".85"/>
  <line x1="96" y1="164" x2="416" y2="164" stroke="url(#edge)" stroke-width="5" stroke-opacity=".55"/>
  <circle cx="126" cy="138" r="7" fill="#FF6B6B" fill-opacity=".85"/>
  <circle cx="150" cy="138" r="7" fill="#FFD166" fill-opacity=".85"/>
  <circle cx="174" cy="138" r="7" fill="#4ADE80" fill-opacity=".85"/>

  <!-- 语义树：页面里真正的结构，而不是像素 -->
  <g stroke="url(#glow)" stroke-width="5" stroke-linecap="round" fill="none" filter="url(#soft)" opacity=".95">
    <path d="M160 250 H352"/>
    <path d="M160 250 V330"/>
    <path d="M256 250 V330"/>
    <path d="M352 250 V330"/>
  </g>
  <g fill="url(#glow)" filter="url(#soft)">
    <circle cx="160" cy="250" r="14"/>
    <circle cx="256" cy="250" r="14"/>
    <circle cx="352" cy="250" r="14"/>
    <rect x="130" y="330" width="60" height="26" rx="13"/>
    <rect x="226" y="330" width="60" height="26" rx="13"/>
    <rect x="322" y="330" width="60" height="26" rx="13"/>
  </g>

  <!-- 光标：Agent 的动作落在节点上，不落在坐标上 -->
  <path d="M300 268 L300 348 L322 328 L338 362 L356 353 L340 320 L368 316 Z"
        fill="#E9D5FF" stroke="#6D28D9" stroke-width="4" stroke-linejoin="round"/>
</svg>
