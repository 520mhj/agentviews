<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  body { font: 13px/1.5 system-ui, sans-serif; width: 280px; padding: 12px; margin: 0; color: #222; }
  h3 { margin: 0 0 8px; font-size: 14px; }
  code { background: #f2f3f5; padding: 1px 4px; border-radius: 3px; font-size: 12px; }
  .row { display: flex; gap: 6px; align-items: center; margin: 8px 0; }
  input { width: 80px; padding: 4px 6px; border: 1px solid #ccc; border-radius: 4px; }
  button { padding: 5px 10px; border: 0; border-radius: 4px; background: #1a73e8; color: #fff; cursor: pointer; }
  #state { padding: 8px; background: #f8f9fa; border-radius: 4px; font-size: 12px; word-break: break-all; }
  .hint { color: #666; font-size: 12px; margin: 10px 0 0; }
</style>
</head>
<body>
  <h3>AgentViews CDP Bridge</h3>
  <div id="state">检查中…</div>
  <div class="row">
    <label for="port">桥端口</label>
    <input id="port" type="number" min="1" max="65535">
    <button id="save">保存</button>
  </div>
  <p class="hint">CLI 侧用 <code>--ext</code> / <code>--auto</code> 连接本扩展；端口需与 <code>AV_BRIDGE_PORT</code> 一致。扩展只在 <code>127.0.0.1</code> 与本機 CLI 通信。</p>
  <script src="popup.js"></script>
</body>
</html>
